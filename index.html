<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die With Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0906;--bg2:#12100d;--bg3:#1a1712;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#f5dfa0;
  --green:#4caf50;--green2:#81c784;
  --purple:#9c27b0;--purple2:#ce93d8;
  --blue:#2196f3;--blue2:#90caf9;
  --red:#f44336;--red2:#ef9a9a;
  --orange:#ff9800;--orange2:#ffcc02;
  --text:#e8dcc8;--text2:#b0a090;--text3:#6b5d4f;
  --card-w:6rem;--card-h:8.625rem;
  --radius:0.5rem;--radius2:0.75rem;
  font-size:16px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'EB Garamond',serif;overflow-x:hidden}
#app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
canvas#particles{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── TYPOGRAPHY ── */
h1,h2,h3,.cinzel{font-family:'Cinzel',serif}
.mono{font-family:'DM Mono',monospace}
.gold{color:var(--gold2)}
.dim{color:var(--text2)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:0.5rem 1.25rem;border:none;border-radius:var(--radius);cursor:pointer;font-family:'Cinzel',serif;font-size:0.85rem;font-weight:700;letter-spacing:0.05em;transition:transform 0.1s,box-shadow 0.1s;user-select:none}
.btn:active{transform:scale(0.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200}
.btn-gold:hover{box-shadow:0 0 16px var(--gold)}
.btn-ghost{background:transparent;border:1px solid var(--text3);color:var(--text2)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-red{background:var(--red);color:#fff}
.btn-full{width:100%}

/* ── SPLASH SCREEN ── */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;position:relative;z-index:1}
.splash-title{font-size:2.8rem;font-weight:900;letter-spacing:0.08em;line-height:1.1;background:linear-gradient(135deg,var(--gold),var(--gold3),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;margin-bottom:0.25rem}
.splash-sub{color:var(--text2);font-size:1rem;font-style:italic;margin-bottom:2.5rem;letter-spacing:0.15em}
.diff-group{display:flex;gap:0.75rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center}
.diff-btn{padding:0.6rem 1.2rem;border-radius:var(--radius);border:2px solid var(--text3);background:transparent;color:var(--text2);cursor:pointer;font-family:'Cinzel',serif;font-size:0.8rem;font-weight:700;letter-spacing:0.06em;transition:all 0.2s}
.diff-btn.active,.diff-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.1)}
.diff-desc{font-size:0.85rem;color:var(--text2);margin-bottom:2rem;min-height:2.5rem;font-style:italic}

/* ── SETUP SCREEN ── */
.setup{display:flex;flex-direction:column;padding:1.5rem;min-height:100vh;gap:1.25rem}
.setup-header{text-align:center;padding:1rem 0}
.setup-header h2{font-size:1.6rem;color:var(--gold2)}
.field label{display:block;font-family:'Cinzel',serif;font-size:0.75rem;color:var(--text2);letter-spacing:0.1em;margin-bottom:0.4rem;text-transform:uppercase}
.field input{width:100%;background:var(--bg3);border:1px solid var(--text3);border-radius:var(--radius);padding:0.7rem 1rem;color:var(--text);font-family:'EB Garamond',serif;font-size:1rem}
.field input:focus{outline:none;border-color:var(--gold)}
.arch-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.arch-card{background:var(--bg3);border:2px solid var(--text3);border-radius:var(--radius2);padding:1rem;cursor:pointer;transition:all 0.2s}
.arch-card:hover,.arch-card.active{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.arch-card.active{box-shadow:0 0 12px rgba(201,168,76,0.3)}
.arch-name{font-family:'Cinzel',serif;font-size:0.9rem;color:var(--gold2);margin-bottom:0.25rem}
.arch-desc{font-size:0.8rem;color:var(--text2);line-height:1.4}

/* ── GAME SCREEN ── */
.game{display:flex;flex-direction:column;min-height:100vh;padding:0.75rem}
.hud{background:var(--bg2);border-radius:var(--radius2);padding:0.75rem;margin-bottom:0.5rem;display:grid;grid-template-columns:1fr 1fr;gap:0.4rem}
.hud-name{grid-column:1/-1;font-family:'Cinzel',serif;font-size:0.8rem;color:var(--gold2);letter-spacing:0.08em}
.hud-stat{display:flex;flex-direction:column}
.hud-label{font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.hud-val{font-family:'DM Mono',monospace;font-size:1rem;color:var(--text)}
.hud-val.money{color:var(--green2)}
.hud-val.xp{color:var(--gold2)}
.window-badge{grid-column:1/-1;display:inline-flex;align-items:center;gap:0.4rem;font-size:0.75rem;font-family:'Cinzel',serif;letter-spacing:0.06em}
.window-badge.young{color:var(--gold2)}
.window-badge.active{color:var(--green2)}
.window-badge.late{color:var(--blue2)}

/* ── VITALITY BAR ── */
.vitality-wrap{margin-bottom:0.5rem}
.vitality-label{font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;font-family:'DM Mono',monospace;margin-bottom:0.25rem}
.vitality-track{height:0.5rem;background:var(--bg3);border-radius:99px;overflow:hidden}
.vitality-fill{height:100%;border-radius:99px;transition:width 0.6s ease,background-color 1s ease}

/* ── WARNING BANNERS ── */
.banner{padding:0.5rem 0.75rem;border-radius:var(--radius);font-size:0.8rem;margin-bottom:0.5rem;font-style:italic}
.banner-orange{background:rgba(255,152,0,0.15);border-left:3px solid var(--orange);color:var(--orange2)}
.banner-red{background:rgba(244,67,54,0.15);border-left:3px solid var(--red);color:var(--red2)}

/* ── ZONES ── */
.zone{margin-bottom:0.5rem}
.zone-label{font-size:0.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;font-family:'DM Mono',monospace;margin-bottom:0.35rem}
.card-row{display:flex;gap:0.4rem;flex-wrap:wrap;min-height:1rem}

/* ── CARDS ── */
.card{width:var(--card-w);min-height:var(--card-h);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.1);background:var(--bg2);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:transform 0.15s,box-shadow 0.15s;flex-shrink:0}
.card:hover:not(.card-locked):not(.card-fate){transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,0.5)}
.card-stripe{height:0.3rem;width:100%;flex-shrink:0}
.card-body{padding:0.35rem;flex:1;display:flex;flex-direction:column;gap:0.2rem}
.card-name{font-family:'Cinzel',serif;font-size:0.58rem;line-height:1.2;color:var(--text);font-weight:700}
.card-type{font-size:0.55rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.card-effect{font-size:0.58rem;color:var(--text2);line-height:1.3;flex:1;font-style:italic}
.card-stats{display:flex;justify-content:space-between;margin-top:auto;font-family:'DM Mono',monospace;font-size:0.6rem}
.card-cost{color:var(--green2)}
.card-xp{color:var(--gold2)}

/* card type colors */
.stripe-experience{background:var(--gold)}
.stripe-job{background:var(--green)}
.stripe-fate{background:var(--purple)}
.stripe-legacy{background:var(--blue)}
.stripe-challenge{background:var(--red)}

.card-fate{cursor:default;opacity:0.85}
.card-locked{cursor:not-allowed;filter:brightness(0.5)}
.card-locked::after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:rgba(0,0,0,0.4);border-radius:var(--radius)}

/* card slide-in */
@keyframes cardIn{from{transform:translateY(3.75rem) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card-new{animation:cardIn 0.35s ease-out both}

/* ── ACTION BAR ── */
.action-bar{display:flex;gap:0.5rem;padding:0.5rem 0;margin-top:auto}
.action-bar .btn{flex:1}

/* ── DEATH SCREEN ── */
.death{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;background:radial-gradient(ellipse at center,#1a0a0a 0%,var(--bg) 70%)}
@keyframes deathReveal{from{opacity:0;transform:scale(1.08);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.death{animation:deathReveal 1.2s ease-in both}
.death-skull{font-size:5rem;margin-bottom:1rem;filter:drop-shadow(0 0 20px rgba(244,67,54,0.6))}
.death-title{font-family:'Cinzel',serif;font-size:2.5rem;font-weight:900;color:var(--red2);letter-spacing:0.1em;margin-bottom:0.5rem}
.death-sub{color:var(--text2);font-style:italic;margin-bottom:1rem;font-size:1.1rem}
.death-epitaph{color:var(--text2);font-style:italic;max-width:340px;line-height:1.6;font-size:0.95rem}

/* ── END SCREEN ── */
.end{display:flex;flex-direction:column;padding:1.5rem;min-height:100vh;gap:1rem}
.score-ring{width:8rem;height:8rem;border-radius:50%;border:4px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 0 30px rgba(201,168,76,0.3)}
.score-num{font-family:'Cinzel',serif;font-size:2.2rem;font-weight:900;color:var(--gold2)}
.score-label{font-size:0.65rem;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase}
.grade-badge{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;padding:0.2rem 1rem;border-radius:var(--radius);margin:0 auto;display:inline-block}
.grade-S{background:rgba(201,168,76,0.2);color:var(--gold2);border:2px solid var(--gold)}
.grade-A{background:rgba(76,175,80,0.2);color:var(--green2);border:2px solid var(--green)}
.grade-B{background:rgba(33,150,243,0.2);color:var(--blue2);border:2px solid var(--blue)}
.grade-C{background:rgba(255,152,0,0.2);color:var(--orange2);border:2px solid var(--orange)}
.grade-D{background:rgba(244,67,54,0.2);color:var(--red2);border:2px solid var(--red)}
.end-section{background:var(--bg2);border-radius:var(--radius2);padding:1rem}
.end-section h3{font-family:'Cinzel',serif;font-size:0.85rem;color:var(--gold2);letter-spacing:0.08em;margin-bottom:0.75rem;border-bottom:1px solid var(--bg3);padding-bottom:0.4rem}
.window-row{display:flex;justify-content:space-between;font-size:0.85rem;padding:0.25rem 0;border-bottom:1px solid var(--bg3)}
.window-row:last-child{border-bottom:none}
.memory-item{display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem}
.memory-xp{font-family:'DM Mono',monospace;color:var(--gold2);font-size:0.75rem;margin-left:auto}
.obj-item{font-size:0.8rem;color:var(--green2);padding:0.15rem 0}
.obj-item::before{content:'✓ '}

/* ── FLOATERS ── */
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-3.75rem);opacity:0}}
.floater{position:fixed;pointer-events:none;font-family:'DM Mono',monospace;font-size:0.9rem;font-weight:500;animation:floatUp 1.2s ease-out both;z-index:9999;white-space:nowrap;transform:translateX(-50%)}

/* ── WINDOW BANNER ── */
@keyframes bannerShow{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.95)}}
.window-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:2px solid var(--gold);border-radius:var(--radius2);padding:1.25rem 2rem;text-align:center;z-index:1000;pointer-events:none;animation:bannerShow 2.2s ease both}
.window-banner .wb-title{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:700;letter-spacing:0.1em}
.window-banner .wb-sub{font-size:0.8rem;color:var(--text2);margin-top:0.25rem;font-style:italic}

/* ── SCROLLABLE HAND ── */
.hand-scroll{display:flex;gap:0.4rem;overflow-x:auto;padding-bottom:0.5rem;scrollbar-width:thin;scrollbar-color:var(--text3) transparent}
.hand-scroll::-webkit-scrollbar{height:3px}
.hand-scroll::-webkit-scrollbar-thumb{background:var(--text3);border-radius:99px}

/* ── MISC ── */
.separator{height:1px;background:var(--bg3);margin:0.25rem 0}
.empty-hint{font-size:0.75rem;color:var(--text3);font-style:italic;padding:0.5rem 0}
</style>
</head>

// STATE
// ═══════════════════════════════════════
const STATE = {
  screen:'splash', difficulty:'normal',
  playerName:'', archetype:null,
  deathTurn:0, turn:0,
  window:'young', windowJustChanged:false, prevWindow:'young',
  money:0, totalMoneyEarned:0, totalMoneySpent:0,
  dormantStreak:0, playedExperienceThisTurn:false,
  xp:0, maxPossibleXP:0, totalDormantPenalty:0,
  deck:[], hand:[], played:[], fateActive:[], discard:[],
  windowLog:{ young:{xp:0,money:0}, active:{xp:0,money:0}, late:{xp:0,money:0} },
  memoriesLog:[], objectivesCompleted:[],
  dwzScore:0, grade:'',
  newCardIds:[], // for slide-in animation tracking
  warningMsg:'', lastWarningTurn:-5,
  pendingChallengeId: null,
};

// ═══════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function diffConfig(){
  const d = STATE.difficulty;
  return {
    deathRange: d==='normal'?[12,20]:d==='hard'?[8,16]:[6,14],
    dormantThreshold: d==='normal'?9000:d==='hard'?7000:5000,
    dormantPenalty: d==='normal'?12:d==='hard'?16:20,
    startMoney: d==='normal'?5000:d==='hard'?3500:2000,
  };
}

function computeWindow(){
  const pct = STATE.turn / STATE.deathTurn;
  if(pct < 0.35) return 'young';
  if(pct < 0.65) return 'active';
  return 'late';
}

function xpMultiplier(){
  const arch = ARCHETYPES[STATE.archetype];
  const base = arch ? arch.xpMult : 1;
  const w = STATE.window;
  const wMult = w==='young'?1.5:w==='active'?1.2:0.6;
  return base * wMult;
}

function isCardLocked(card){
  if(card.type==='fate') return true; // fate never playable
  if(card.legacyOnly && STATE.window!=='late') return true;
  if(card.type==='experience' && STATE.window==='late') return true;
  return false;
}

function initGame(){
  const cfg = diffConfig();
  const arch = ARCHETYPES[STATE.archetype] || ARCHETYPES.explorer;
  STATE.deathTurn = rand(cfg.deathRange[0], cfg.deathRange[1]);
  STATE.turn = 1;
  STATE.window = 'young';
  STATE.prevWindow = 'young';
  STATE.windowJustChanged = false;
  STATE.money = cfg.startMoney + arch.startBonus;
  STATE.totalMoneyEarned = STATE.money;
  STATE.totalMoneySpent = 0;
  STATE.dormantStreak = 0;
  STATE.playedExperienceThisTurn = false;
  STATE.xp = 0;
  STATE.totalDormantPenalty = 0;
  STATE.deck = shuffle([...CARD_DECK]);
  STATE.hand = [];
  STATE.played = [];
  STATE.fateActive = [];
  STATE.discard = [];
  STATE.windowLog = {young:{xp:0,money:0},active:{xp:0,money:0},late:{xp:0,money:0}};
  STATE.memoriesLog = [];
  STATE.objectivesCompleted = [];
  STATE.dwzScore = 0;
  STATE.grade = '';
  STATE.newCardIds = [];
  STATE.warningMsg = '';
  STATE.lastWarningTurn = -5;
  // compute max possible XP from non-fate, non-job cards in deck
  STATE.maxPossibleXP = CARD_DECK.filter(c=>c.type!=='fate'&&c.type!=='job').reduce((s,c)=>s+c.xpValue,0);
  drawCards(4);
}

function drawCards(n){
  STATE.newCardIds = [];
  for(let i=0;i<n;i++){
    if(STATE.hand.length>=7) break;
    if(STATE.deck.length===0){
      STATE.deck = shuffle([...STATE.discard]);
      STATE.discard = [];
      if(STATE.deck.length===0) break;
    }
    const card = STATE.deck.shift();
    if(card.type==='fate'){
      // fate goes straight to active zone
      const fateCopy = {...card, instanceId: card.id+'_'+Date.now()+'_'+Math.random()};
      STATE.fateActive.push(fateCopy);
      i--; // draw replacement
    } else {
      const copy = {...card, instanceId: card.id+'_'+Date.now()+'_'+Math.random()};
      STATE.hand.push(copy);
      STATE.newCardIds.push(copy.instanceId);
    }
  }
}

function addMoney(amt, source){
  STATE.money += amt;
  if(amt>0) STATE.totalMoneyEarned += amt;
  // track window log
  if(amt>0) STATE.windowLog[STATE.window].money += amt;
}

function addXP(amt){
  const gained = Math.round(amt * xpMultiplier());
  STATE.xp += gained;
  STATE.windowLog[STATE.window].xp += gained;
  return gained;
}

function playCard(instanceId){
  const idx = STATE.hand.findIndex(c=>c.instanceId===instanceId);
  if(idx===-1) return {ok:false,msg:'Card not in hand'};
  const card = STATE.hand[idx];
  if(isCardLocked(card)) return {ok:false,msg:'Card is locked'};

  const arch = ARCHETYPES[STATE.archetype];
  let cost = card.cost;
  if(card.legacyOnly && arch) cost = Math.round(cost * arch.legacyCostMult);

  if(STATE.money < cost) return {ok:false,msg:'Not enough money'};

  // remove from hand
  STATE.hand.splice(idx,1);

  // pay cost
  if(cost>0){
    STATE.money -= cost;
    STATE.totalMoneySpent += cost;
  }

  let xpGained = 0;

  if(card.type==='experience'){
    let base = card.xpValue;
    if(arch && arch.expBonus) base += arch.expBonus;
    xpGained = addXP(base);
    STATE.playedExperienceThisTurn = true;
    STATE.dormantStreak = 0;
    STATE.memoriesLog.push({name:card.name,xp:xpGained,turn:STATE.turn});
    STATE.discard.push(card);
    checkObjectives(card,'play');
    return {ok:true, xpGained, moneySpent:cost};
  }

  if(card.type==='job'){
    if(card.cost>0){ /* already paid */ }
    STATE.played.push({...card});
    STATE.discard.push(card);
    checkObjectives(card,'play');
    return {ok:true, xpGained:0, moneySpent:cost};
  }

  if(card.type==='legacy'){
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
    STATE.dormantStreak = 0;
    STATE.memoriesLog.push({name:card.name,xp:xpGained,turn:STATE.turn});
    STATE.discard.push(card);
    checkObjectives(card,'play');
    return {ok:true, xpGained, moneySpent:cost};
  }

  if(card.type==='challenge'){
    return resolveChallenge(card);
  }

  STATE.discard.push(card);
  return {ok:true,xpGained:0,moneySpent:cost};
}

function resolveChallenge(card){
  let xpGained = 0;
  let moneyDelta = 0;
  const roll = Math.random();

  if(card.id==='c01'){ // Bet It All
    if(roll<0.5){addMoney(10000,'challenge');moneyDelta=10000;}
    else{STATE.money-=5000;STATE.totalMoneySpent+=5000;moneyDelta=-5000;}
  } else if(card.id==='c02'){ // Quit and Travel
    const jobIdx = STATE.played.findIndex(c=>c.type==='job');
    if(jobIdx>=0) STATE.played.splice(jobIdx,1);
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c03'){ // Start Over
    STATE.discard.push(...STATE.hand);
    STATE.hand=[];
    drawCards(5);
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c04'){ // Friend's Dream
    if(roll<0.6){addMoney(8000,'challenge');moneyDelta=8000;}
    else{xpGained=addXP(card.xpValue);STATE.playedExperienceThisTurn=true;}
  } else if(card.id==='c05'){ // Reject Promotion
    let maxSalary=0, maxIdx=-1;
    STATE.played.forEach((c,i)=>{if(c.salary>maxSalary){maxSalary=c.salary;maxIdx=i;}});
    if(maxIdx>=0) STATE.played.splice(maxIdx,1);
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c06'){ // Off-Grid
    STATE._skipSalaryNextTurn = true;
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c07'){ // Ignore Doctor
    if(STATE.fateActive.length>0) STATE.fateActive.shift();
    STATE.deathTurn = Math.max(STATE.turn+1, STATE.deathTurn-1);
  } else if(card.id==='c08'){ // Unpaid Internship
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
    drawCards(2);
  } else if(card.id==='c09'){ // Buy the Boat
    xpGained = addXP(card.xpValue);
    STATE.played.push({...card, salary:0, xpPerTurn:card.xpValue});
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c10'){ // Move Abroad
    xpGained = addXP(card.xpValue);
    STATE.played.forEach(c=>{if(c.type==='job')c.salary+=500;});
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c11'){ // Cut Toxic Ties
    if(STATE.fateActive.length>0) STATE.fateActive.shift();
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c12'){ // Startup Lottery
    if(roll<0.4){
      const exec = CARD_DECK.find(c=>c.id==='j15');
      if(exec) STATE.played.push({...exec,instanceId:'exec_'+Date.now()});
    }
  } else if(card.id==='c13'){ // Refuse Inheritance
    STATE.money -= 2000; STATE.totalMoneySpent += 2000;
    moneyDelta = -2000;
    xpGained = addXP(card.xpValue);
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c14'){ // Risky Passion
    xpGained = addXP(card.xpValue);
    STATE.played.push({...card, salary:card.salary});
    STATE.playedExperienceThisTurn = true;
  } else if(card.id==='c15'){ // Gamble Retirement
    if(roll<0.5){addMoney(20000,'challenge');moneyDelta=20000;}
    // else nothing
  }

  STATE.dormantStreak = 0;
  STATE.memoriesLog.push({name:card.name,xp:xpGained,turn:STATE.turn});
  STATE.discard.push(card);
  checkObjectives(card,'play');
  return {ok:true, xpGained, moneyDelta, moneySpent:card.cost||0};
}

function endTurn(){
  // 1. Apply job salaries
  if(!STATE._skipSalaryNextTurn){
    const arch = ARCHETYPES[STATE.archetype];
    const mult = arch ? arch.salaryMult : 1;
    STATE.played.forEach(c=>{
      if(c.salary && c.salary>0){
        const pay = Math.round(c.salary * mult);
        addMoney(pay,'salary');
      }
      if(c.xpValue>0 && c.type==='job'){
        addXP(c.xpValue);
      }
      if(c.xpPerTurn){
        addXP(c.xpPerTurn);
      }
    });
  }
  STATE._skipSalaryNextTurn = false;

  // 2. Apply fate damage
  const fateToRemove = [];
  STATE.fateActive.forEach((f,i)=>{
    if(f.fateDamage>0){
      STATE.money -= f.fateDamage;
      STATE.totalMoneySpent += f.fateDamage;
    }
    if(f.id==='f03') STATE.xp = Math.max(0,STATE.xp-5);
    if(f.id==='f05'){ // Layoff removes a job
      const jobIdx = STATE.played.findIndex(c=>c.type==='job');
      if(jobIdx>=0) STATE.played.splice(jobIdx,1);
      fateToRemove.push(i);
    }
    if(f.id==='f07') addXP(8); // Aging parent gives XP
    if(f.id==='f14') STATE.xp = Math.max(0,STATE.xp-10);
    if(f.id==='f15') STATE.xp = Math.max(0,STATE.xp-15);
    // one-shot fates
    if(f.id==='f06'||f.id==='f09'||f.id==='f12') fateToRemove.push(i);
  });
  fateToRemove.reverse().forEach(i=>STATE.fateActive.splice(i,1));

  // 3. Dormant penalty check
  const cfg = diffConfig();
  if(STATE.money > cfg.dormantThreshold && !STATE.playedExperienceThisTurn){
    STATE.dormantStreak++;
    const penalty = cfg.dormantPenalty * STATE.dormantStreak;
    STATE.xp = Math.max(0, STATE.xp - penalty);
    STATE.totalDormantPenalty += penalty;
  } else if(STATE.playedExperienceThisTurn){
    STATE.dormantStreak = 0;
  }

  // 4. Window transition
  const newWindow = computeWindow();
  if(newWindow !== STATE.window){
    STATE.prevWindow = STATE.window;
    STATE.window = newWindow;
    STATE.windowJustChanged = true;
  }

  // 5. Advance turn
  STATE.turn++;
  STATE.playedExperienceThisTurn = false;

  // 6. Death check
  if(STATE.turn > STATE.deathTurn){
    computeScore();
    STATE.screen = 'death';
    render();
    return;
  }

  // 7. Draw 3 cards
  drawCards(3);

  // 8. Near-death warning
  maybeShowWarning();

  render();
  if(STATE.windowJustChanged){
    showWindowBanner(STATE.window);
    STATE.windowJustChanged = false;
  }
}

function maybeShowWarning(){
  const pct = STATE.turn / STATE.deathTurn;
  if(pct >= 0.7 && STATE.turn - STATE.lastWarningTurn >= 2){
    const pool = Math.random()<0.4 ? FALSE_POSITIVES : WARNINGS;
    STATE.warningMsg = pool[Math.floor(Math.random()*pool.length)];
    STATE.lastWarningTurn = STATE.turn;
  } else if(pct < 0.7){
    STATE.warningMsg = '';
  }
}

function checkObjectives(card, event){
  const objs = STATE.objectivesCompleted;
  if(card.type==='legacy' && !objs.includes('First Legacy')) objs.push('First Legacy');
  if(card.type==='challenge' && !objs.includes('Risk Taker')) objs.push('Risk Taker');
  if(card.xpValue>=30 && !objs.includes('Big Memory')) objs.push('Big Memory');
  if(STATE.played.filter(c=>c.type==='job').length>=3 && !objs.includes('Career Builder')) objs.push('Career Builder');
  if(STATE.totalMoneySpent>=20000 && !objs.includes('Spendthrift')) objs.push('Spendthrift');
  if(STATE.xp>=100 && !objs.includes('Rich Life')) objs.push('Rich Life');
  if(STATE.fateActive.length===0 && STATE.turn>3 && !objs.includes('Fate Beater')) objs.push('Fate Beater');
  if(STATE.dormantStreak===0 && STATE.turn>5 && !objs.includes('No Hoarding')) objs.push('No Hoarding');
}

function computeScore(){
  const moneyRatio = STATE.totalMoneyEarned>0 ? STATE.totalMoneySpent/STATE.totalMoneyEarned : 0;
  const xpRatio    = STATE.maxPossibleXP>0 ? Math.min(STATE.xp/STATE.maxPossibleXP,1) : 0;
  const dormPenalty = Math.min(STATE.totalDormantPenalty * 0.5, 40);
  const raw = (moneyRatio*50) + (xpRatio*50) - dormPenalty;
  STATE.dwzScore = Math.max(0, Math.round(raw));
  const s = STATE.dwzScore;
  STATE.grade = s>=90?'S':s>=75?'A':s>=60?'B':s>=45?'C':'D';
}

// ═══════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════
function fmt$(n){ return '$'+Math.max(0,Math.round(n)).toLocaleString(); }
function fmtXP(n){ return Math.round(n)+'xp'; }

function renderCard(card, opts={}){
  const locked = !opts.forceUnlock && isCardLocked(card);
  const isNew  = STATE.newCardIds.includes(card.instanceId);
  const delay  = opts.delay||0;
  const classes = ['card',
    `card-type-${card.type}`,
    locked?'card-locked':'',
    card.type==='fate'?'card-fate':'',
    isNew?'card-new':'',
  ].filter(Boolean).join(' ');

  const costStr  = card.cost>0 ? `<span class="card-cost">-${fmt$(card.cost)}</span>` : '';
  const xpStr    = card.xpValue>0 ? `<span class="card-xp">+${card.xpValue}xp</span>` : '';
  const salStr   = card.salary>0 ? `<span class="card-cost" style="color:var(--green2)">+${fmt$(card.salary)}/t</span>` : '';
  const dmgStr   = card.fateDamage>0 ? `<span style="color:var(--red2)">-${fmt$(card.fateDamage)}/t</span>` : '';

  const action = (!locked && card.type!=='fate') ? `data-action="play-card" data-id="${card.instanceId}"` : '';

  return `<div class="${classes}" ${action} style="animation-delay:${delay}ms">
  <div class="card-stripe stripe-${card.type}"></div>
  <div class="card-body">
    <div class="card-name">${card.name}</div>
    <div class="card-type">${card.type}</div>
    <div class="card-effect">${card.effect}</div>
    <div class="card-stats">${costStr}${salStr}${dmgStr}${xpStr}</div>
  </div>
</div>`;
}

function renderVitalityBar(){
  const pct = Math.max(0, (STATE.deathTurn - STATE.turn + 1) / STATE.deathTurn);
  const w = Math.round(pct * 100);
  const color = pct>0.6?'#4caf50':pct>0.3?'#ff9800':'#f44336';
  return `<div class="vitality-wrap">
  <div class="vitality-label mono">Vitality</div>
  <div class="vitality-track">
    <div class="vitality-fill" style="width:${w}%;background-color:${color}"></div>
  </div>
</div>`;
}

// ═══════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════
function renderSplash(){
  const diffs = ['normal','hard','brutal'];
  const descs = {
    normal:'12–20 turns · $9k dormant threshold · Standard XP',
    hard:'8–16 turns · $7k dormant threshold · Harder XP',
    brutal:'6–14 turns · $5k dormant threshold · Brutal XP',
  };
  const btns = diffs.map(d=>`<button class="diff-btn${STATE.difficulty===d?' active':''}" data-action="set-diff" data-id="${d}">${d.charAt(0).toUpperCase()+d.slice(1)}</button>`).join('');
  return `<div class="splash">
  <h1 class="splash-title">DIE<br>WITH<br>ZERO</h1>
  <p class="splash-sub">A life fully spent</p>
  <div class="diff-group">${btns}</div>
  <p class="diff-desc">${descs[STATE.difficulty]}</p>
  <button class="btn btn-gold btn-full" data-action="go-setup" style="max-width:240px">Begin Your Life →</button>
</div>`;
}

function renderSetup(){
  const archs = Object.entries(ARCHETYPES).map(([key,a])=>`
  <div class="arch-card${STATE.archetype===key?' active':''}" data-action="set-arch" data-id="${key}">
    <div class="arch-name">${a.emoji} ${a.name}</div>
    <div class="arch-desc">${a.desc}</div>
  </div>`).join('');
  return `<div class="setup">
  <div class="setup-header"><h2>Who Are You?</h2></div>
  <div class="field">
    <label>Your Name</label>
    <input id="pname" type="text" maxlength="24" placeholder="Enter your name" value="${STATE.playerName}">
  </div>
  <div class="field"><label>Choose Your Archetype</label></div>
  <div class="arch-grid">${archs}</div>
  <div style="margin-top:auto;padding-top:1rem">
    <div style="font-size:0.8rem;color:var(--text2);margin-bottom:0.75rem;font-style:italic">
      Difficulty: <strong style="color:var(--gold2)">${STATE.difficulty}</strong>
    </div>
    <button class="btn btn-gold btn-full" data-action="start-game">Start Game →</button>
  </div>
</div>`;
}

function renderGame(){
  const arch = ARCHETYPES[STATE.archetype];
  const wLabels = {young:'Young',active:'Active',late:'Late'};
  const wColors = {young:'var(--gold2)',active:'var(--green2)',late:'var(--blue2)'};
  const cfg = diffConfig();

  // HUD
  const hud = `<div class="hud">
  <div class="hud-name">${STATE.playerName} · ${arch?arch.emoji+' '+arch.name:''}</div>
  <div class="hud-stat"><span class="hud-label">Turn</span><span class="hud-val mono">${STATE.turn}</span></div>
  <div class="hud-stat"><span class="hud-label">Window</span><span class="hud-val" style="color:${wColors[STATE.window]};font-family:Cinzel,serif;font-size:0.85rem">${wLabels[STATE.window]}</span></div>
  <div class="hud-stat"><span class="hud-label">Money</span><span class="hud-val money mono">${fmt$(STATE.money)}</span></div>
  <div class="hud-stat"><span class="hud-label">XP</span><span class="hud-val xp mono">${fmtXP(STATE.xp)}</span></div>
</div>`;

  // Vitality
  const vbar = renderVitalityBar();

  // Warning banners
  let banners = '';
  if(STATE.dormantStreak>0){
    banners += `<div class="banner banner-orange">⚠ Dormant Money — ${STATE.dormantStreak} turn streak. Playing no experiences while holding ${fmt$(cfg.dormantThreshold)}+ costs XP.</div>`;
  }
  if(STATE.warningMsg){
    banners += `<div class="banner banner-red">💀 ${STATE.warningMsg}</div>`;
  }

  // Fate zone
  const fateCards = STATE.fateActive.length>0
    ? STATE.fateActive.map((c,i)=>renderCard(c,{delay:i*60})).join('')
    : `<span class="empty-hint">No fate cards active</span>`;

  // Played zone
  const playedCards = STATE.played.length>0
    ? STATE.played.map((c,i)=>renderCard(c,{forceUnlock:true,delay:i*40})).join('')
    : `<span class="empty-hint">No cards in play</span>`;

  // Hand
  const handCards = STATE.hand.length>0
    ? STATE.hand.map((c,i)=>renderCard(c,{delay:i*80})).join('')
    : `<span class="empty-hint">Hand is empty</span>`;

  return `<div class="game">
  ${hud}
  ${vbar}
  ${banners}
  <div class="zone">
    <div class="zone-label">⚔ Fate Zone</div>
    <div class="card-row">${fateCards}</div>
  </div>
  <div class="zone">
    <div class="zone-label">📋 In Play</div>
    <div class="card-row">${playedCards}</div>
  </div>
  <div class="separator"></div>
  <div class="zone" style="margin-top:0.5rem">
    <div class="zone-label">🃏 Your Hand (${STATE.hand.length}/7)</div>
    <div class="hand-scroll">${handCards}</div>
  </div>
  <div class="action-bar">
    <button class="btn btn-ghost" data-action="draw-card" ${STATE.hand.length>=7?'disabled':''}>Draw Card</button>
    <button class="btn btn-gold" data-action="end-turn">End Turn →</button>
  </div>
</div>`;
}

function renderDeath(){
  const epitaph = EPITAPHS[Math.floor(Math.random()*EPITAPHS.length)];
  return `<div class="death">
  <div class="death-skull">💀</div>
  <div class="death-title">GAME OVER</div>
  <div class="death-sub">${STATE.playerName} · Turn ${STATE.turn-1}</div>
  <div class="death-epitaph">"${epitaph}"</div>
  <div style="margin-top:2rem;color:var(--text3);font-size:0.8rem;font-style:italic">Calculating your DwZ Score...</div>
</div>`;
}

function renderEnd(){
  const s = STATE.dwzScore;
  const gradeColor = {S:'var(--gold2)',A:'var(--green2)',B:'var(--blue2)',C:'var(--orange2)',D:'var(--red2)'}[STATE.grade]||'var(--text)';

  // Window breakdown
  const wRows = ['young','active','late'].map(w=>{
    const wl = STATE.windowLog[w];
    const label = {young:'Young',active:'Active',late:'Late'}[w];
    const color = {young:'var(--gold2)',active:'var(--green2)',late:'var(--blue2)'}[w];
    return `<div class="window-row">
      <span style="color:${color};font-family:Cinzel,serif;font-size:0.8rem">${label}</span>
      <span class="mono" style="font-size:0.8rem">${fmtXP(wl.xp)} · ${fmt$(wl.money)}</span>
    </div>`;
  }).join('');

  // Top memories
  const top5 = [...STATE.memoriesLog].sort((a,b)=>b.xp-a.xp).slice(0,5);
  const memItems = top5.length>0
    ? top5.map(m=>`<div class="memory-item"><span>${m.name}</span><span class="memory-xp">+${m.xp}xp (T${m.turn})</span></div>`).join('')
    : '<div class="empty-hint">No memories recorded</div>';

  // Objectives
  const objItems = STATE.objectivesCompleted.length>0
    ? STATE.objectivesCompleted.map(o=>`<div class="obj-item">${o}</div>`).join('')
    : '<div class="empty-hint">No objectives completed</div>';

  // Stats
  const moneyRatio = STATE.totalMoneyEarned>0?Math.round(STATE.totalMoneySpent/STATE.totalMoneyEarned*100):0;

  return `<div class="end">
  <div style="text-align:center;padding:0.5rem 0">
    <h2 class="cinzel" style="color:var(--gold2);font-size:1.4rem;letter-spacing:0.1em">Die With Zero</h2>
    <p style="font-size:0.8rem;color:var(--text2);font-style:italic">${STATE.playerName} · ${STATE.difficulty}</p>
  </div>
  <div class="score-ring">
    <div class="score-num">${s}</div>
    <div class="score-label">DwZ Score</div>
  </div>
  <div style="text-align:center">
    <span class="grade-badge grade-${STATE.grade}">Grade ${STATE.grade}</span>
  </div>
  <div class="end-section">
    <h3>Life Windows</h3>
    ${wRows}
  </div>
  <div class="end-section">
    <h3>Top Memories</h3>
    ${memItems}
  </div>
  <div class="end-section">
    <h3>Objectives</h3>
    ${objItems}
  </div>
  <div class="end-section">
    <h3>Final Stats</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;font-size:0.85rem">
      <div class="dim">Turns Lived</div><div class="mono" style="text-align:right">${STATE.turn-1}</div>
      <div class="dim">Money Spent</div><div class="mono" style="text-align:right;color:var(--green2)">${fmt$(STATE.totalMoneySpent)}</div>
      <div class="dim">Spent Ratio</div><div class="mono" style="text-align:right">${moneyRatio}%</div>
      <div class="dim">Total XP</div><div class="mono" style="text-align:right;color:var(--gold2)">${fmtXP(STATE.xp)}</div>
      <div class="dim">Dormant Penalty</div><div class="mono" style="text-align:right;color:var(--orange2)">${Math.round(STATE.totalDormantPenalty)}xp</div>
    </div>
  </div>
  <button class="btn btn-gold btn-full" data-action="play-again">Play Again</button>
  <div style="height:1.5rem"></div>
</div>`;
}

// ═══════════════════════════════════════
// RENDER DISPATCHER
// ═══════════════════════════════════════
function render(){
  const app = document.getElementById('app');
  switch(STATE.screen){
    case 'splash': app.innerHTML = renderSplash(); initParticles(); break;
    case 'setup':  app.innerHTML = renderSetup();  stopParticles(); break;
    case 'game':   app.innerHTML = renderGame();   stopParticles(); break;
    case 'death':  app.innerHTML = renderDeath();  stopParticles();
      setTimeout(()=>{ STATE.screen='end'; render(); }, 3600); break;
    case 'end':    app.innerHTML = renderEnd();    break;
  }
  // Re-attach name input listener after setup render
  if(STATE.screen==='setup'){
    const inp = document.getElementById('pname');
    if(inp) inp.addEventListener('input',e=>{ STATE.playerName = e.target.value; });
  }
}

// ═══════════════════════════════════════
// ANIMATIONS
// ═══════════════════════════════════════
let _particleRAF = null;
let _particles = [];

function initParticles(){
  const canvas = document.getElementById('particles');
  if(!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  _particles = Array.from({length:60},()=>({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    vx:(Math.random()-0.5)*0.4,
    vy:-Math.random()*0.5-0.2,
    r: Math.random()*2+0.5,
    alpha: Math.random()*0.5+0.1,
    color: Math.random()<0.5?'#c9a84c':'#e8c97a',
  }));
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    _particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-5){p.y=canvas.height+5;p.x=Math.random()*canvas.width;}
      if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color;
      ctx.globalAlpha=p.alpha;
      ctx.fill();
    });
    ctx.globalAlpha=1;
    _particleRAF = requestAnimationFrame(loop);
  }
  stopParticles();
  loop();
}

function stopParticles(){
  if(_particleRAF){ cancelAnimationFrame(_particleRAF); _particleRAF=null; }
  const canvas = document.getElementById('particles');
  if(canvas){ const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); }
}

function spawnFloater(text, color, x, y){
  const el = document.createElement('div');
  el.className='floater';
  el.textContent=text;
  el.style.cssText=`left:${x}px;top:${y}px;color:${color}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}

function showWindowBanner(win){
  const labels={young:'Young Window',active:'Active Window',late:'Late Window'};
  const subs={
    young:'XP ×1.5 · All cards available',
    active:'XP ×1.2 · Most cards available',
    late:'XP ×0.6 · Adventure cards locked · Legacy unlocked',
  };
  const colors={young:'var(--gold)',active:'var(--green)',late:'var(--blue)'};
  const el = document.createElement('div');
  el.className='window-banner';
  el.style.borderColor=colors[win];
  el.innerHTML=`<div class="wb-title" style="color:${colors[win]}">${labels[win]}</div>
  <div class="wb-sub">${subs[win]}</div>`;
  document.getElementById('app').appendChild(el);
  setTimeout(()=>el.remove(),2300);
}

// ═══════════════════════════════════════
// EVENT HANDLING
// ═══════════════════════════════════════
document.getElementById('app').addEventListener('click',function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id     = el.dataset.id;

  if(action==='set-diff'){ STATE.difficulty=id; render(); return; }
  if(action==='go-setup'){ STATE.screen='setup'; render(); return; }
  if(action==='set-arch'){ STATE.archetype=id; render(); return; }

  if(action==='start-game'){
    if(!STATE.playerName.trim()){ alert('Please enter your name.'); return; }
    if(!STATE.archetype){ alert('Please choose an archetype.'); return; }
    initGame();
    STATE.screen='game';
    render();
    return;
  }

  if(action==='play-card'){
    const result = playCard(id);
    if(!result.ok){ return; }
    // spawn floaters
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    if(result.xpGained>0) spawnFloater('+'+result.xpGained+'xp','#e8c97a',cx,cy-20);
    if(result.moneySpent>0) spawnFloater('-'+fmt$(result.moneySpent),'#ef9a9a',cx,cy+10);
    if(result.moneyDelta>0) spawnFloater('+'+fmt$(result.moneyDelta),'#81c784',cx,cy+10);
    render();
    return;
  }

  if(action==='draw-card'){
    drawCards(1);
    render();
    return;
  }

  if(action==='end-turn'){
    const rect = el.getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy=rect.top;
    // salary preview floater
    const arch = ARCHETYPES[STATE.archetype];
    const mult = arch?arch.salaryMult:1;
    const totalSalary = STATE.played.reduce((s,c)=>s+(c.salary||0)*mult,0);
    if(totalSalary>0) spawnFloater('+'+fmt$(totalSalary),'#81c784',cx,cy-10);
    endTurn();
    return;
  }

  if(action==='play-again'){
    STATE.screen='splash';
    STATE.difficulty='normal';
    STATE.playerName='';
    STATE.archetype=null;
    render();
    return;
  }
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
render();
</script>
